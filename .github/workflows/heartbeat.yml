name: heartbeat supabase
 
# Supabase mette in pausa i progetti gratuiti dopo 7 giorni di scarsa attività.
# Non basta aprire una connessione: serve una scrittura vera, quindi qui si fa
# un UPDATE sulla tabella heartbeat. Ogni 3 giorni per stare larghi.
 
on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Scrivi su heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sS --fail-with-body \
            -X PATCH "${SUPABASE_URL}/rest/v1/heartbeat?id=eq.1" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"ultimo\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
 
