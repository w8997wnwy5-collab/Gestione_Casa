<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9ECE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spese">
<title>Spese di casa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9ECE8;
  --card:#F4F6F2;
  --card2:#FFFFFF;
  --ink:#16211D;
  --soft:#5D6A65;
  --line:#CFD6CF;
  --line2:#E2E7E1;
  --matteo:#1F6F68;
  --gaia:#8E4368;
  --focus:#9A7500;
  --ombra:0 1px 2px rgba(22,33,29,.06), 0 6px 18px rgba(22,33,29,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#121614;
    --card:#1A201D;
    --card2:#212824;
    --ink:#E7ECE7;
    --soft:#93A09A;
    --line:#2C3531;
    --line2:#252D29;
    --matteo:#3E9A91;
    --gaia:#C0799C;
    --focus:#D9B44A;
    --ombra:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
.num{font-family:"Space Grotesk",system-ui,sans-serif;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}
.hidden{display:none !important}
svg{display:block}

/* ---------------- intestazione ---------------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 6px}
.top .marchio{display:flex;align-items:center;gap:9px}
.top h1{font-family:"Space Grotesk",sans-serif;font-size:16px;font-weight:500;margin:0;letter-spacing:-.01em}
.top .chi{font-size:12px;color:var(--soft)}
.linkbtn{color:var(--soft);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.linkbtn:hover{color:var(--ink)}

.mesenav{display:flex;align-items:center;justify-content:space-between;padding:6px 0 16px}
.mesenav .etichetta{font-family:"Space Grotesk",sans-serif;font-size:20px;font-weight:500;letter-spacing:-.02em;text-transform:capitalize}
.frecce{display:flex;gap:4px}
.frecce button{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--soft)}
.frecce button:hover:not(:disabled){color:var(--ink);border-color:var(--ink)}
.frecce button:disabled{opacity:.35;cursor:default}

/* ---------------- saldo ---------------- */
.saldo{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--ombra);border:1px solid var(--line2)}
.saldo .occhiello{font-size:13px;color:var(--soft);letter-spacing:.02em}
.saldo .cifra{
  font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums;font-weight:500;
  font-size:clamp(42px,13vw,58px);line-height:1.05;letter-spacing:-.035em;
  margin:4px 0 0;display:flex;align-items:baseline;gap:7px;color:var(--matteo);
}
.saldo.verso-gaia .cifra{color:var(--gaia)}
.saldo.pari .cifra{color:var(--ink)}
.saldo .cifra small{font-size:16px;font-weight:400;color:var(--soft);letter-spacing:0}
.saldo .riga2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.saldo .nota{font-size:13px;color:var(--soft)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 15px;font-size:14px;font-weight:500}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.pieno{width:100%;padding:14px;font-size:15px}

/* ---------------- filtri ---------------- */
.filtri{display:flex;gap:7px;overflow-x:auto;padding:18px 0 4px;scrollbar-width:none}
.filtri::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap;color:var(--soft)}
.fchip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------------- elenco ---------------- */
.giorno-sep{font-size:12px;color:var(--soft);padding:18px 0 6px;letter-spacing:.03em}
.voce{width:100%;display:flex;align-items:center;gap:13px;padding:11px 0;text-align:left;border-bottom:1px solid var(--line2)}
.voce:hover{background:rgba(125,125,125,.05)}
.pallino{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff}
.voce .testo{flex:1;min-width:0}
.voce .desc{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voce .sotto{font-size:12.5px;color:var(--soft);margin-top:2px;display:flex;align-items:center;gap:7px}
.quota{display:flex;height:3px;width:38px;border-radius:2px;overflow:hidden;background:var(--line)}
.quota i{display:block;height:100%}
.quota .m{background:var(--matteo)}
.quota .g{background:var(--gaia)}
.voce .imp{font-size:15px;white-space:nowrap;text-align:right}
.voce .imp small{display:block;font-size:11.5px;color:var(--soft);font-weight:400}
.voce.rimb .desc{font-style:italic;color:var(--soft)}
.dettaglio{background:var(--card);border-radius:12px;padding:14px;margin:2px 0 10px;border:1px solid var(--line2)}
.dettaglio dl{margin:0 0 12px;font-size:13.5px}
.dettaglio dl div{display:flex;gap:10px;padding:3px 0}
.dettaglio dt{min-width:92px;color:var(--soft);flex:none}
.dettaglio dd{margin:0}
.dettaglio .azioni{display:flex;gap:8px}
.vuoto{padding:40px 4px;color:var(--soft);font-size:14.5px;text-align:center}

/* ---------------- riepilogo ---------------- */
.scheda{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--ombra)}
.scheda h3{margin:0 0 14px;font-size:13px;font-weight:500;color:var(--soft);letter-spacing:.03em}
.totmese{font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums;font-size:40px;font-weight:500;letter-spacing:-.03em;line-height:1}
.totmese small{font-size:15px;color:var(--soft);font-weight:400;letter-spacing:0;margin-left:6px}
.delta{font-size:13px;margin-top:8px;color:var(--soft)}
.delta b{font-weight:500;color:var(--ink)}
.donutbox{position:relative;width:150px;height:150px;flex:none;margin:0 auto}
.donutbox .centro{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donutbox .centro .v{font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums;font-size:19px;font-weight:500}
.donutbox .centro .e{font-size:11px;color:var(--soft)}
.legenda{margin-top:18px;display:flex;flex-direction:column;gap:11px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.lrow .nome{font-size:14px;display:flex;align-items:center;gap:8px}
.lrow .dot{width:9px;height:9px;border-radius:3px;flex:none}
.lrow .val{font-size:14px;font-variant-numeric:tabular-nums}
.lrow .perc{font-size:12px;color:var(--soft);margin-left:6px}
.lbar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line2);overflow:hidden}
.lbar i{display:block;height:100%;border-radius:3px}
.persona{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.persona .tag{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;flex:none}
.persona .nome{font-size:14px;flex:1}
.coppia{display:flex;gap:16px;font-size:12.5px;color:var(--soft);margin:0 0 8px 36px}
.coppia b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500;font-family:"Space Grotesk",sans-serif}
.trend{display:flex;align-items:flex-end;gap:9px;height:110px;margin-top:4px}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.tbar{width:100%;max-width:34px;background:var(--line);border-radius:5px 5px 2px 2px;transition:height .2s}
.tb.sel .tbar{background:var(--matteo)}
.tb span{font-size:11px;color:var(--soft)}
.tb b{font-size:10.5px;color:var(--soft);font-weight:400;font-variant-numeric:tabular-nums}

/* ---------------- barra in basso ---------------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:9;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line2);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
}
.tabbar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-around;padding:0 18px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--soft);font-size:11px;padding:5px 18px;border-radius:10px}
.tab[aria-selected=true]{color:var(--ink)}
.fab{width:52px;height:52px;border-radius:17px;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:var(--ombra)}
.fab:hover{opacity:.88}

/* ---------------- pannello ---------------- */
.velo{position:fixed;inset:0;background:rgba(10,16,14,.5);z-index:10}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card2);
  border-radius:20px 20px 0 0;max-height:94vh;overflow-y:auto;
  padding:8px 18px calc(24px + env(safe-area-inset-bottom));
}
@media(min-width:600px){.sheet{max-width:600px;margin:0 auto;border-radius:20px;bottom:14px;left:14px;right:14px}}
.maniglia{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.sheet h2{font-family:"Space Grotesk",sans-serif;font-size:19px;font-weight:500;margin:0 0 18px}
.campo{margin-bottom:16px}
.campo label{display:block;font-size:13px;color:var(--soft);margin-bottom:7px}
.campo input{width:100%;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:11px}
.campo input:focus{border-color:var(--ink);outline:none}
.grande{font-family:"Space Grotesk",sans-serif;font-size:30px;font-variant-numeric:tabular-nums;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13.5px;display:flex;align-items:center;gap:7px;color:var(--soft)}
.chip[aria-pressed=true]{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.chip .ci{width:16px;height:16px}
.slider{display:flex;align-items:center;gap:12px;margin-top:14px}
.slider input{flex:1;accent-color:var(--matteo)}
.leg{font-size:12.5px;color:var(--soft);white-space:nowrap}
.avviso{margin:0 0 14px;padding:11px 13px;border-radius:11px;background:#F6E4DE;color:#7A2E16;font-size:13.5px;border:1px solid #E7C8BE}
@media (prefers-color-scheme: dark){.avviso{background:#3A211A;color:#F0BBA6;border-color:#54301F}}
.stato{font-size:12px;color:var(--soft);text-align:center;padding:16px 0 4px}

/* ---------------- accesso ---------------- */
.login{max-width:330px;margin:14vh auto 0;padding:0 18px;text-align:center}
.login img{width:74px;height:74px;border-radius:22px;margin:0 auto 18px;box-shadow:var(--ombra)}
.login h1{font-family:"Space Grotesk",sans-serif;font-size:25px;font-weight:500;letter-spacing:-.02em;margin:0 0 6px}
.login p.intro{margin:0 0 22px;color:var(--soft);font-size:14.5px}
.login .campo{text-align:left}

@media(prefers-reduced-motion:no-preference){
  .sheet{animation:su .2s ease-out}
  @keyframes su{from{transform:translateY(16px)}to{transform:none}}
}
</style>
</head>
<body>

<!-- ==================== ACCESSO ==================== -->
<section id="vistaLogin" class="login hidden">
  <img src="icon-192.png" alt="">
  <h1>Spese di casa</h1>
  <p class="intro">Entra con il tuo account.</p>
  <div id="erroreLogin" class="avviso hidden"></div>
  <div class="campo">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" inputmode="email">
  </div>
  <div class="campo">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
  </div>
  <button id="btnEntra" class="btn pieno">Entra</button>
</section>

<!-- ==================== APP ==================== -->
<main id="vistaApp" class="wrap hidden">
  <div class="top">
    <div class="marchio">
      <div>
        <h1>Spese di casa</h1>
        <div class="chi" id="chiSono"></div>
      </div>
    </div>
    <div>
      <button id="btnEsporta" class="linkbtn">Esporta</button>
      <button id="btnEsci" class="linkbtn">Esci</button>
    </div>
  </div>

  <div class="mesenav">
    <span class="etichetta" id="etichettaMese">—</span>
    <div class="frecce">
      <button id="mesePrec" aria-label="Mese precedente">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="meseSucc" aria-label="Mese successivo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <!-- scheda spese -->
  <section id="schedaSpese">
    <div id="saldo" class="saldo" aria-live="polite">
      <div class="occhiello" id="saldoTesto">Calcolo…</div>
      <div class="cifra"><span id="saldoCifra">—</span><small>CHF</small></div>
      <div class="riga2">
        <span class="nota" id="saldoNota"></span>
        <button id="btnSalda" class="btn ghost hidden">Pareggia</button>
      </div>
    </div>
    <div class="filtri" id="filtri"></div>
    <div id="elenco"></div>
  </section>

  <!-- scheda riepilogo -->
  <section id="schedaRiepilogo" class="hidden">
    <div id="riepilogo"></div>
  </section>

  <p id="stato" class="stato"></p>
</main>

<!-- ==================== BARRA ==================== -->
<nav class="tabbar hidden" id="tabbar">
  <div class="in">
    <button class="tab" id="tabSpese" aria-selected="true">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      Spese
    </button>
    <button class="fab" id="btnAggiungi" aria-label="Aggiungi una spesa">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" id="tabRiepilogo" aria-selected="false">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V10M12 19V5M19 19v-6"/></svg>
      Riepilogo
    </button>
  </div>
</nav>

<!-- ==================== PANNELLO ==================== -->
<div id="velo" class="velo hidden"></div>
<section id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitolo">
  <div class="maniglia"></div>
  <h2 id="sheetTitolo">Nuova spesa</h2>
  <div id="erroreSheet" class="avviso hidden"></div>

  <div class="campo">
    <label for="fImporto">Importo in CHF</label>
    <input id="fImporto" class="grande num" type="number" inputmode="decimal" step="0.05" min="0.05" placeholder="0.00">
  </div>

  <div class="campo">
    <label for="fDescrizione">Descrizione</label>
    <input id="fDescrizione" type="text" placeholder="Spesa Coop, affitto, bolletta…">
  </div>

  <div class="campo">
    <label for="fData">Data</label>
    <input id="fData" type="date">
  </div>

  <div class="campo" id="campoCategoria">
    <label>Categoria</label>
    <div class="chips" id="fCategoria"></div>
  </div>

  <div class="campo">
    <label>Chi ha pagato</label>
    <div class="chips" id="fPagante">
      <button class="chip" data-chi="matteo" aria-pressed="false">Matteo</button>
      <button class="chip" data-chi="gaia" aria-pressed="false">Gaia</button>
    </div>
  </div>

  <div class="campo" id="campoQuote">
    <label>Come si divide</label>
    <div class="chips" id="fQuote">
      <button class="chip" data-q="50" aria-pressed="true">Metà e metà</button>
      <button class="chip" data-q="100" aria-pressed="false">Tutta a Matteo</button>
      <button class="chip" data-q="0" aria-pressed="false">Tutta a Gaia</button>
      <button class="chip" data-q="custom" aria-pressed="false">Altre quote</button>
    </div>
    <div class="slider hidden" id="boxSlider">
      <input id="fSlider" type="range" min="0" max="100" step="5" value="50" aria-label="Percentuale a carico di Matteo">
      <span class="leg" id="legSlider">Matteo 50% / Gaia 50%</span>
    </div>
    <p class="leg" id="anteprima" style="margin:12px 0 0"></p>
  </div>

  <div class="campo">
    <label for="fNote">Note</label>
    <input id="fNote" type="text" placeholder="facoltativo">
  </div>

  <div style="display:flex;gap:10px;padding-bottom:6px">
    <button id="btnAnnulla" class="btn ghost" style="flex:1">Annulla</button>
    <button id="btnSalva" class="btn" style="flex:2">Salva</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   CONFIGURAZIONE — Settings > API Keys (publishable) e Settings > Data API
   (Project URL). La publishable key è pubblica per costruzione: a
   proteggere i dati sono le policy RLS di schema.sql. La secret key non
   va mai messa qui dentro.
   ===================================================================== */
const CONFIG = {
  url:       'https://tvfettcfuceroylgdnfh.supabase.co',
  publicKey: 'sb_publishable_3IcIL1qugOIZaVxv9yapdg_RksVRBMr'
};

/* ---------------- categorie ---------------- */
const CATEGORIE = [
  { n:'Spesa',     c:'#5C8F56', i:'carrello' },
  { n:'Casa',      c:'#52739A', i:'casa'     },
  { n:'Bollette',  c:'#C2903F', i:'fulmine'  },
  { n:'Fuori',     c:'#B15740', i:'posate'   },
  { n:'Trasporti', c:'#7E6BA8', i:'auto'     },
  { n:'Salute',    c:'#3E8E8A', i:'salute'   },
  { n:'Altro',     c:'#7E8B85', i:'altro'    }
];
const ICONE = {
  carrello:'<path d="M3 4.2h2.1l2.3 9.3a1.6 1.6 0 0 0 1.6 1.2h7.4a1.6 1.6 0 0 0 1.6-1.2l1.4-5.9H6.2"/><circle cx="9.6" cy="19" r="1.3"/><circle cx="16.8" cy="19" r="1.3"/>',
  casa:'<path d="M4.2 11.3 12 4.7l7.8 6.6V19a1.6 1.6 0 0 1-1.6 1.6h-3V15H8.8v5.6h-3A1.6 1.6 0 0 1 4.2 19z"/>',
  fulmine:'<path d="M13.3 3 5.8 13.5h5.1L10 21l7.5-10.5h-5.1z"/>',
  posate:'<path d="M7.4 3v5.4M10.5 3v5.4M9 8.4V21M16.8 3.2c1.6 1.5 2.3 3.9 2.3 6.4 0 1.8-1 2.9-2.3 2.9s-2.3-1.1-2.3-2.9c0-2.5.7-4.9 2.3-6.4zM16.8 12.5V21"/>',
  auto:'<path d="m4.5 15.2 1.6-5A2 2 0 0 1 8 8.8h8a2 2 0 0 1 1.9 1.4l1.6 5M4.5 15.2h15v3.3h-2.8v-1.4H7.3v1.4H4.5z"/><circle cx="7.8" cy="12" r=".9"/><circle cx="16.2" cy="12" r=".9"/>',
  salute:'<circle cx="12" cy="12" r="7.5"/><path d="M12 8.5v7M8.5 12h7"/>',
  altro:'<circle cx="6.3" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="17.7" cy="12" r="1.4" fill="currentColor" stroke="none"/>'
};
const NOMI = { matteo:'Matteo', gaia:'Gaia' };
const cat = n => CATEGORIE.find(c => c.n === n) || { n:n||'Altro', c:'#7E8B85', i:'altro' };
const ico = (nome, s) => '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + (ICONE[nome]||ICONE.altro) + '</svg>';

/* ---------------- stato ---------------- */
const db = window.supabase.createClient(CONFIG.url, CONFIG.publicKey);
let io = null, righe = [], meseSel = null;
let scheda = 'spese', filtro = null, apertaId = null, modo = 'spesa', modificaId = null;
const $ = s => document.querySelector(s);

/* ---------------- utilità ---------------- */
function chf(n){
  const neg = n < -0.004;
  const [i,d] = Math.abs(n).toFixed(2).split('.');
  return (neg?'−':'') + i.replace(/\B(?=(\d{3})+(?!\d))/g,"'") + '.' + d;
}
// data locale, non UTC: con toISOString a Lugano prima delle 2 di notte
// si finirebbe per registrare la spesa il giorno prima
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const oggi = () => ymd(new Date());
const meseCorrente = () => ymd(new Date()).slice(0,7);
const meseDi = k => new Date(k + '-01T00:00:00');
const fmtMeseLungo = new Intl.DateTimeFormat('it-CH',{month:'long',year:'numeric'});
const fmtMeseCorto = new Intl.DateTimeFormat('it-CH',{month:'short'});
const fmtGiorno    = new Intl.DateTimeFormat('it-CH',{weekday:'short',day:'numeric',month:'short'});
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function meseAdiacente(k, passo){
  const d = meseDi(k); d.setMonth(d.getMonth() + passo);
  return ymd(d).slice(0,7);
}

/* ---------------- calcoli ---------------- */
function quotaDi(r, chi){
  const imp = Number(r.importo);
  if (r.tipo === 'rimborso') return r.pagato_da === chi ? 0 : imp;
  const p = chi === 'matteo' ? Number(r.quota_matteo) : 100 - Number(r.quota_matteo);
  return imp * p / 100;
}
const saldoDi = chi => righe.reduce((a,r) => a + ((r.pagato_da===chi?Number(r.importo):0) - quotaDi(r,chi)), 0);
const delMese = (k, soloSpese) => righe.filter(r => r.data.slice(0,7)===k && (!soloSpese || r.tipo==='spesa'));
const somma = a => a.reduce((s,r) => s + Number(r.importo), 0);

/* =====================================================================
   Accesso
   ===================================================================== */
async function entra(){
  const email = $('#email').value.trim(), pw = $('#password').value;
  if (!email || !pw) return errore('#erroreLogin','Inserisci email e password.');
  $('#btnEntra').disabled = true; $('#btnEntra').textContent = 'Un attimo…';
  const { error } = await db.auth.signInWithPassword({ email, password: pw });
  $('#btnEntra').disabled = false; $('#btnEntra').textContent = 'Entra';
  if (error) return errore('#erroreLogin','Email o password non corretti.');
  $('#password').value = ''; avvia();
}
async function avvia(){
  const { data:{ session } } = await db.auth.getSession();
  if (!session) return mostraLogin();
  const { data, error } = await db.from('membri').select('nome').eq('user_id', session.user.id).maybeSingle();
  if (error || !data){
    await db.auth.signOut();
    mostraLogin();
    return errore('#erroreLogin','Account non collegato a nessun membro. Va aggiunta la riga in tabella membri.');
  }
  io = data.nome;
  $('#chiSono').textContent = 'Ciao ' + NOMI[io];
  $('#vistaLogin').classList.add('hidden');
  $('#vistaApp').classList.remove('hidden');
  $('#tabbar').classList.remove('hidden');
  carica();
}
function mostraLogin(){
  $('#vistaApp').classList.add('hidden');
  $('#tabbar').classList.add('hidden');
  $('#vistaLogin').classList.remove('hidden');
}

/* =====================================================================
   Dati
   ===================================================================== */
async function carica(){
  $('#stato').textContent = 'Caricamento…';
  const { data, error } = await db.from('spese').select('*')
    .order('data',{ascending:false}).order('creato_il',{ascending:false});
  if (error){ $('#stato').textContent = 'Errore di lettura: ' + error.message; return; }
  righe = data || [];
  disegna();
  $('#stato').textContent = 'Aggiornato alle ' +
    new Date().toLocaleTimeString('it-CH',{hour:'2-digit',minute:'2-digit'});
}

function disegna(){
  const mesi = [...new Set(righe.map(r => r.data.slice(0,7)))].sort();
  const minimo = mesi[0] || meseCorrente();
  const massimo = meseCorrente();
  $('#mesePrec').disabled = meseSel <= minimo;
  $('#meseSucc').disabled = meseSel >= massimo;
  $('#etichettaMese').textContent = fmtMeseLungo.format(meseDi(meseSel));
  disegnaSaldo();
  if (scheda === 'spese'){ disegnaFiltri(); disegnaElenco(); }
  else disegnaRiepilogo();
}

function disegnaSaldo(){
  const mio = saldoDi(io), altro = io === 'matteo' ? 'gaia' : 'matteo';
  const box = $('#saldo');
  box.classList.remove('verso-gaia','pari');
  if (Math.abs(mio) < 0.01){
    box.classList.add('pari');
    $('#saldoTesto').textContent = 'Siete pari';
    $('#saldoCifra').textContent = '0.00';
    $('#saldoNota').textContent = 'Nessuno deve niente.';
    $('#btnSalda').classList.add('hidden');
  } else {
    const inCredito = mio > 0;
    if ((inCredito && io==='gaia') || (!inCredito && io==='matteo')) box.classList.add('verso-gaia');
    $('#saldoTesto').textContent = inCredito ? NOMI[altro] + ' ti deve' : 'Devi a ' + NOMI[altro];
    $('#saldoCifra').textContent = chf(Math.abs(mio));
    $('#saldoNota').textContent = inCredito
      ? 'Hai anticipato più della tua quota.'
      : 'Ha anticipato più della sua quota.';
    $('#btnSalda').classList.remove('hidden');
  }
}

function disegnaFiltri(){
  const presenti = [...new Set(delMese(meseSel,true).map(r => r.categoria))];
  const box = $('#filtri');
  box.innerHTML = '';
  if (!presenti.length) return;
  const tutte = document.createElement('button');
  tutte.className = 'fchip'; tutte.textContent = 'Tutte';
  tutte.setAttribute('aria-pressed', String(filtro === null));
  tutte.onclick = () => { filtro = null; disegna(); };
  box.appendChild(tutte);
  CATEGORIE.filter(c => presenti.includes(c.n)).forEach(c => {
    const b = document.createElement('button');
    b.className = 'fchip'; b.textContent = c.n;
    b.setAttribute('aria-pressed', String(filtro === c.n));
    if (filtro === c.n){ b.style.background = c.c; b.style.borderColor = c.c; b.style.color = '#fff'; }
    b.onclick = () => { filtro = (filtro === c.n ? null : c.n); disegna(); };
    box.appendChild(b);
  });
}

function disegnaElenco(){
  const el = $('#elenco');
  el.innerHTML = '';
  let lista = delMese(meseSel, false);
  if (filtro) lista = lista.filter(r => r.categoria === filtro && r.tipo === 'spesa');
  if (!lista.length){
    el.innerHTML = '<p class="vuoto">Nessun movimento in questo mese.</p>';
    return;
  }
  let giornoCorrente = null;
  lista.forEach(r => {
    if (r.data !== giornoCorrente){
      giornoCorrente = r.data;
      const s = document.createElement('div');
      s.className = 'giorno-sep';
      s.textContent = fmtGiorno.format(new Date(r.data + 'T00:00:00'));
      el.appendChild(s);
    }
    const c = cat(r.categoria), qm = Number(r.quota_matteo), mio = quotaDi(r, io);
    const b = document.createElement('button');
    b.className = 'voce' + (r.tipo === 'rimborso' ? ' rimb' : '');
    b.innerHTML =
      '<span class="pallino" style="background:' + (r.tipo==='rimborso' ? 'var(--soft)' : c.c) + '">' +
        (r.tipo==='rimborso'
          ? '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13l-3-3M20 15H7l3 3"/></svg>'
          : ico(c.i, 19)) +
      '</span>' +
      '<span class="testo">' +
        '<span class="desc">' + escapeHtml(r.descrizione) + '</span>' +
        '<span class="sotto">' + NOMI[r.pagato_da] + ' ha pagato' +
          (r.tipo === 'spesa'
            ? '<span class="quota" title="Matteo ' + qm + '% / Gaia ' + (100-qm) + '%"><i class="m" style="width:' + qm + '%"></i><i class="g" style="width:' + (100-qm) + '%"></i></span>'
            : '') +
        '</span>' +
      '</span>' +
      '<span class="imp num">' + chf(Number(r.importo)) +
        (r.tipo === 'spesa' ? '<small>tuoi ' + chf(mio) + '</small>' : '') +
      '</span>';
    b.onclick = () => { apertaId = (apertaId === r.id ? null : r.id); disegnaElenco(); };
    el.appendChild(b);

    if (apertaId === r.id){
      const d = document.createElement('div');
      d.className = 'dettaglio';
      d.innerHTML =
        '<dl>' +
          (r.tipo === 'spesa'
            ? '<div><dt>Categoria</dt><dd>' + escapeHtml(r.categoria) + '</dd></div>' +
              '<div><dt>Quote</dt><dd>Matteo ' + qm + '% · ' + chf(Number(r.importo)*qm/100) + ' &nbsp;|&nbsp; Gaia ' + (100-qm) + '% · ' + chf(Number(r.importo)*(100-qm)/100) + '</dd></div>'
            : '<div><dt>Movimento</dt><dd>' + NOMI[r.pagato_da] + ' ha rimborsato ' + NOMI[r.pagato_da==='matteo'?'gaia':'matteo'] + '</dd></div>') +
          (r.note ? '<div><dt>Note</dt><dd>' + escapeHtml(r.note) + '</dd></div>' : '') +
        '</dl>' +
        '<div class="azioni">' +
          '<button class="btn ghost" data-mod>Modifica</button>' +
          '<button class="btn ghost" data-del>Elimina</button>' +
        '</div>';
      d.querySelector('[data-mod]').onclick = () => apri(r.tipo, r);
      d.querySelector('[data-del]').onclick = () => elimina(r);
      el.appendChild(d);
    }
  });
}

/* =====================================================================
   Riepilogo
   ===================================================================== */
function disegnaRiepilogo(){
  const spese = delMese(meseSel, true);
  const totale = somma(spese);
  const prec = somma(delMese(meseAdiacente(meseSel,-1), true));

  // totale del mese e confronto
  let html = '<div class="scheda"><h3>Totale del mese</h3>' +
    '<div class="totmese">' + chf(totale) + '<small>CHF</small></div>';
  if (prec > 0){
    const d = (totale - prec) / prec * 100;
    const verso = d >= 0 ? 'in più' : 'in meno';
    html += '<div class="delta"><b>' + Math.abs(d).toFixed(0) + '% ' + verso + '</b> rispetto a ' +
      fmtMeseLungo.format(meseDi(meseAdiacente(meseSel,-1))).replace(/ \d{4}/,'') +
      ', che aveva chiuso a ' + chf(prec) + '.</div>';
  } else if (totale > 0){
    html += '<div class="delta">Primo mese con spese registrate.</div>';
  }
  html += '</div>';

  // categorie
  const perCat = CATEGORIE.map(c => ({
    nome:c.n, col:c.c, ic:c.i,
    tot: somma(spese.filter(r => r.categoria === c.n))
  })).filter(v => v.tot > 0).sort((a,b) => b.tot - a.tot);

  if (perCat.length){
    let seg = '', off = 0;
    const R = 52, C = 2 * Math.PI * R;
    perCat.forEach(v => {
      const len = v.tot / totale * C;
      const gap = len > 8 ? 3 : 0;
      seg += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + v.col + '" stroke-width="16"' +
             ' stroke-dasharray="' + Math.max(len-gap,0) + ' ' + (C-len+gap) + '"' +
             ' stroke-dashoffset="' + (-off) + '" transform="rotate(-90 70 70)"/>';
      off += len;
    });
    html += '<div class="scheda"><h3>Dove sono andati</h3>' +
      '<div class="donutbox"><svg viewBox="0 0 140 140" width="150" height="150">' + seg + '</svg>' +
        '<div class="centro"><div class="v num">' + perCat.length + '</div><div class="e">categorie</div></div>' +
      '</div><div class="legenda">' +
      perCat.map(v =>
        '<div class="lrow">' +
          '<span class="nome"><span class="dot" style="background:' + v.col + '"></span>' + v.nome + '</span>' +
          '<span class="val num">' + chf(v.tot) + '<span class="perc">' + (v.tot/totale*100).toFixed(0) + '%</span></span>' +
          '<span class="lbar"><i style="width:' + (v.tot/totale*100) + '%;background:' + v.col + '"></i></span>' +
        '</div>').join('') +
      '</div></div>';
  }

  // chi ha anticipato, chi ha speso
  if (spese.length){
    const dati = ['matteo','gaia'].map(p => ({
      p, nome:NOMI[p],
      anticipato: somma(spese.filter(r => r.pagato_da === p)),
      carico: spese.reduce((s,r) => s + quotaDi(r,p), 0),
      col: p === 'matteo' ? 'var(--matteo)' : 'var(--gaia)'
    }));
    const max = Math.max(...dati.map(d => Math.max(d.anticipato, d.carico)), 1);
    html += '<div class="scheda"><h3>Chi ha anticipato, chi ha speso</h3>' +
      dati.map(d =>
        '<div><div class="persona">' +
          '<span class="tag" style="background:' + d.col + '">' + d.nome[0] + '</span>' +
          '<span class="nome">' + d.nome + '</span></div>' +
        '<div class="coppia">' +
          '<span>anticipato<b>' + chf(d.anticipato) + '</b></span>' +
          '<span>a suo carico<b>' + chf(d.carico) + '</b></span>' +
        '</div>' +
        '<span class="lbar" style="margin:0 0 6px 36px;width:calc(100% - 36px)"><i style="width:' + (d.anticipato/max*100) + '%;background:' + d.col + '"></i></span>' +
        '<span class="lbar" style="margin:0 0 18px 36px;width:calc(100% - 36px);opacity:.45"><i style="width:' + (d.carico/max*100) + '%;background:' + d.col + '"></i></span>' +
        '</div>').join('') +
      '</div>';
  }

  // andamento sei mesi
  const serie = [];
  for (let i = 5; i >= 0; i--){
    const k = meseAdiacente(meseSel, -i);
    serie.push({ k, lab: fmtMeseCorto.format(meseDi(k)).replace('.',''), tot: somma(delMese(k,true)) });
  }
  const maxS = Math.max(...serie.map(s => s.tot), 1);
  const conDati = serie.filter(s => s.tot > 0);
  html += '<div class="scheda"><h3>Ultimi sei mesi</h3><div class="trend">' +
    serie.map(s =>
      '<div class="tb' + (s.k === meseSel ? ' sel' : '') + '">' +
        '<b>' + (s.tot ? Math.round(s.tot) : '') + '</b>' +
        '<div class="tbar" style="height:' + Math.max(s.tot/maxS*100, 2) + '%"></div>' +
        '<span>' + s.lab + '</span>' +
      '</div>').join('') +
    '</div>' +
    (conDati.length > 1
      ? '<div class="delta" style="margin-top:14px">Media dei mesi con spese: <b>' +
        chf(conDati.reduce((s,x) => s + x.tot, 0) / conDati.length) + ' CHF</b></div>'
      : '') +
    '</div>';

  if (!spese.length){
    html = '<p class="vuoto">Nessuna spesa in questo mese, non c\'è niente da riepilogare.</p>';
  }
  $('#riepilogo').innerHTML = html;
}

/* =====================================================================
   Pannello
   ===================================================================== */
function costruisciCategorie(){
  const box = $('#fCategoria');
  box.innerHTML = '';
  CATEGORIE.forEach((c,i) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.cat = c.n;
    b.innerHTML = '<span class="ci">' + ico(c.i,16) + '</span>' + c.n;
    b.setAttribute('aria-pressed', String(i === 0));
    if (i === 0){ b.style.background = c.c; b.style.borderColor = c.c; b.style.color = '#fff'; }
    b.onclick = () => selezionaCategoria(c.n);
    box.appendChild(b);
  });
}
function selezionaCategoria(nome){
  document.querySelectorAll('#fCategoria .chip').forEach(b => {
    const sel = b.dataset.cat === nome, c = cat(b.dataset.cat);
    b.setAttribute('aria-pressed', String(sel));
    b.style.background = sel ? c.c : '';
    b.style.borderColor = sel ? c.c : '';
    b.style.color = sel ? '#fff' : '';
  });
}
const scelto = sel => [...document.querySelectorAll(sel + ' .chip')].find(x => x.getAttribute('aria-pressed') === 'true');
function impostaPagante(chi){
  document.querySelectorAll('#fPagante .chip').forEach(b => {
    const sel = b.dataset.chi === chi;
    b.setAttribute('aria-pressed', String(sel));
    b.style.background = sel ? (chi==='matteo'?'var(--matteo)':'var(--gaia)') : '';
    b.style.borderColor = sel ? 'transparent' : '';
    b.style.color = sel ? '#fff' : '';
  });
}
function impostaQuote(v){
  document.querySelectorAll('#fQuote .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === v)));
  $('#boxSlider').classList.toggle('hidden', v !== 'custom');
}
function quotaScelta(){
  const c = scelto('#fQuote');
  if (!c) return 50;
  return c.dataset.q === 'custom' ? Number($('#fSlider').value) : Number(c.dataset.q);
}
function anteprima(){
  if (modo !== 'spesa'){ $('#anteprima').textContent = ''; return; }
  const imp = Number($('#fImporto').value || 0), q = quotaScelta();
  $('#legSlider').textContent = 'Matteo ' + q + '% / Gaia ' + (100-q) + '%';
  $('#anteprima').textContent = imp > 0
    ? 'Matteo ' + chf(imp*q/100) + ' CHF, Gaia ' + chf(imp*(100-q)/100) + ' CHF' : '';
}

function apri(tipo, r){
  modo = tipo; modificaId = r ? r.id : null;
  $('#erroreSheet').classList.add('hidden');
  $('#sheetTitolo').textContent = r ? 'Modifica' : (tipo === 'spesa' ? 'Nuova spesa' : 'Pareggia il conto');
  $('#btnSalva').textContent = r ? 'Salva modifiche' : 'Salva';
  $('#campoCategoria').classList.toggle('hidden', tipo !== 'spesa');
  $('#campoQuote').classList.toggle('hidden', tipo !== 'spesa');
  $('#boxSlider').classList.add('hidden');

  if (r){
    $('#fImporto').value = Number(r.importo);
    $('#fDescrizione').value = r.descrizione;
    $('#fData').value = r.data;
    $('#fNote').value = r.note || '';
    impostaPagante(r.pagato_da);
    if (tipo === 'spesa'){
      selezionaCategoria(r.categoria);
      const q = Number(r.quota_matteo);
      if ([0,50,100].includes(q)) impostaQuote(String(q));
      else { impostaQuote('custom'); $('#fSlider').value = q; }
    }
  } else if (tipo === 'spesa'){
    $('#fImporto').value = ''; $('#fDescrizione').value = ''; $('#fNote').value = '';
    $('#fData').value = oggi();
    selezionaCategoria('Spesa'); impostaPagante(io); impostaQuote('50');
  } else {
    const mio = saldoDi(io);
    $('#fImporto').value = Math.abs(mio).toFixed(2);
    $('#fDescrizione').value = 'Pareggio';
    $('#fNote').value = ''; $('#fData').value = oggi();
    impostaPagante(mio < 0 ? io : (io === 'matteo' ? 'gaia' : 'matteo'));
  }
  $('#velo').classList.remove('hidden');
  $('#sheet').classList.remove('hidden');
  anteprima();
  if (!r) setTimeout(() => $('#fImporto').focus(), 80);
}
function chiudi(){ $('#velo').classList.add('hidden'); $('#sheet').classList.add('hidden'); modificaId = null; }

async function salva(){
  const imp = Number($('#fImporto').value), desc = $('#fDescrizione').value.trim(), paga = scelto('#fPagante');
  if (!(imp > 0)) return errore('#erroreSheet','Metti un importo maggiore di zero.');
  if (!desc)      return errore('#erroreSheet','Metti una descrizione, serve per ritrovarla.');
  if (!paga)      return errore('#erroreSheet','Indica chi ha pagato.');
  const riga = {
    data: $('#fData').value || oggi(),
    descrizione: desc,
    importo: imp,
    pagato_da: paga.dataset.chi,
    tipo: modo,
    note: $('#fNote').value.trim() || null,
    categoria: modo === 'spesa' ? (scelto('#fCategoria')?.dataset.cat || 'Altro') : 'Altro',
    quota_matteo: modo === 'spesa' ? quotaScelta() : 50
  };
  $('#btnSalva').disabled = true;
  const { error } = modificaId
    ? await db.from('spese').update(riga).eq('id', modificaId)
    : await db.from('spese').insert(riga);
  $('#btnSalva').disabled = false;
  if (error) return errore('#erroreSheet','Non sono riuscito a salvare: ' + error.message);
  meseSel = riga.data.slice(0,7);
  apertaId = null;
  chiudi();
  carica();
}
async function elimina(r){
  if (!confirm('Eliminare "' + r.descrizione + '" da ' + chf(Number(r.importo)) + ' CHF?')) return;
  const { error } = await db.from('spese').delete().eq('id', r.id);
  if (error) return alert('Non sono riuscito a eliminare: ' + error.message);
  apertaId = null; carica();
}
function errore(sel, testo){
  const e = $(sel); e.textContent = testo; e.classList.remove('hidden');
}
function esporta(){
  const blob = new Blob([JSON.stringify(righe,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'spese-casa-' + oggi() + '.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function vaiA(nome){
  scheda = nome;
  $('#schedaSpese').classList.toggle('hidden', nome !== 'spese');
  $('#schedaRiepilogo').classList.toggle('hidden', nome !== 'riepilogo');
  $('#tabSpese').setAttribute('aria-selected', String(nome === 'spese'));
  $('#tabRiepilogo').setAttribute('aria-selected', String(nome === 'riepilogo'));
  window.scrollTo({ top:0, behavior:'instant' });
  disegna();
}

/* ---------------- collegamenti ---------------- */
$('#btnEntra').onclick = entra;
$('#password').addEventListener('keydown', e => { if (e.key === 'Enter') entra(); });
$('#btnAggiungi').onclick = () => apri('spesa', null);
$('#btnSalda').onclick   = () => apri('rimborso', null);
